<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homework AI Typing Studio</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #eef3ff;
      --primary: #3d6ef7;
      --primary-dark: #254eca;
      --text: #1a2433;
      --muted: #5d6b82;
      --border: #dfe7f5;
      --success: #0d9f6e;
      --warning: #c57d12;
      --danger: #d93e3e;
      --shadow: 0 12px 28px rgba(32, 49, 81, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #f5f7fb 0%, #edf3ff 100%);
      color: var(--text);
    }

    .app {
      max-width: 1280px;
      margin: 32px auto;
      padding: 0 20px 32px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding: 18px 22px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .header-title {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 2rem);
      letter-spacing: -0.04em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary-dark);
      background: #eaf0ff;
      border: 1px solid #dfe7ff;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 14px;
      background: #fbfcff;
      font: 500 0.95rem/1.5 "Segoe UI", sans-serif;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: rgba(61, 110, 247, 0.5);
      box-shadow: 0 0 0 4px rgba(61, 110, 247, 0.08);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 18px 0;
      padding: 12px 14px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 30px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #d3dbef;
      border-radius: 999px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 4px;
      top: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      transition: 0.2s ease;
    }

    .switch input:checked + .slider {
      background: linear-gradient(135deg, var(--primary), #6aa2ff);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    .button-row,
    .import-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font: 700 0.96rem/1.2 "Segoe UI", sans-serif;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    button:active { transform: translateY(0); }

    .primary {
      background: linear-gradient(135deg, var(--primary), #5d89ff);
      color: white;
      box-shadow: 0 10px 18px rgba(61, 110, 247, 0.22);
    }

    .ghost {
      background: #eef2ff;
      color: var(--primary-dark);
    }

    .secondary {
      background: #edf4ff;
      color: #1c3d8d;
      border: 1px solid #d9e6ff;
    }

    .file-upload {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      overflow: hidden;
      border-radius: 12px;
      background: #f0f4ff;
      color: var(--primary-dark);
      border: 1px solid #dfe7ff;
      cursor: pointer;
    }

    .file-upload input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-upload span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 12px 16px;
      font-weight: 700;
    }

    .source-box {
      margin-top: 18px;
      background: #fbfcff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .source-box .label {
      display: block;
      margin: 0 0 8px;
      font-size: 0.76rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #sourceMeta {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text);
      word-break: break-word;
    }

    .output-panel {
      min-height: 650px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: -0.03em;
    }

    .typed-output {
      min-height: 320px;
      background: linear-gradient(180deg, #fbfcff 0%, #f7f9ff 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 18px 20px;
      font-size: 1rem;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      overflow: auto;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .typed-output::after {
      content: "|";
      display: inline-block;
      animation: blink 1s steps(1) infinite;
      color: var(--primary);
      margin-left: 2px;
      font-weight: 700;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .history {
      margin-top: 22px;
    }

    .history h3 {
      margin: 0 0 10px;
      font-size: 0.94rem;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 14px;
      padding: 10px 12px;
      background: #f8faff;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
    }

    .timestamp {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      align-self: center;
    }

    .activity {
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    @media (max-width: 940px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .output-panel {
        min-height: 520px;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="header-title">Homework AI Typing Studio</h1>
      <div class="badge" id="liveStatus">Ready</div>
    </header>

    <main class="layout">
      <aside class="panel">
        <div class="group">
          <label for="questionInput">Homework question</label>
          <textarea id="questionInput">Explain the causes of the French Revolution and give 3 specific examples.</textarea>
        </div>

        <div class="group">
          <label for="notesInput">Notes / context</label>
          <textarea id="notesInput">Use a clear high-school writing style. Mention economic instability, Enlightenment ideas, and social inequality. Keep the answer fact-based and concise.</textarea>
        </div>

        <div class="toggle-row">
          <span style="font-weight:600;">Allow web search</span>
          <label class="switch" aria-label="Toggle web search">
            <input id="webSearchToggle" type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="button-row">
          <button class="primary" id="generateBtn">Generate homework</button>
          <button class="ghost" id="resetBtn">Reset</button>
        </div>

        <div class="import-row">
          <button class="secondary" id="googleImportBtn">Import Google file</button>

          <label class="file-upload">
            <input id="localFileInput" type="file" accept=".txt,.md,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf" />
            <span>Upload file</span>
          </label>
        </div>

        <div class="source-box">
          <span class="label">Imported source</span>
          <div id="sourceMeta">None selected</div>
        </div>
      </aside>

      <section class="panel output-panel">
        <div class="topbar">
          <h2>Live answer preview</h2>
          <span class="badge" id="typingStatus">Idle</span>
        </div>

        <div id="typedPreview" class="typed-output" aria-live="polite"></div>

        <div class="history">
          <h3>Activity history (simulated)</h3>
          <ul id="historyList" class="history-list"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script>
    const liveStatus = document.getElementById("liveStatus");
    const typingStatus = document.getElementById("typingStatus");
    const sourceMeta = document.getElementById("sourceMeta");
    const typedPreview = document.getElementById("typedPreview");
    const historyList = document.getElementById("historyList");
    const questionInput = document.getElementById("questionInput");
    const notesInput = document.getElementById("notesInput");
    const webSearchToggle = document.getElementById("webSearchToggle");
    const localFileInput = document.getElementById("localFileInput");

    const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com";
    const GOOGLE_API_KEY = "YOUR_GOOGLE_API_KEY";
    const GOOGLE_APP_ID = "YOUR_GOOGLE_APP_ID"; // Optional but recommended for Google Picker

    const state = {
      importedText: "",
      sourceLabel: "None selected",
      sourceKind: "none",
      googleAccessToken: null,
      typingTimer: null,
      isTyping: false
    };

    function setBadge(text, tone = "default") {
      liveStatus.textContent = text;
      liveStatus.style.background =
        tone === "success" ? "#e7f9f3" :
        tone === "warning" ? "#fff4df" :
        tone === "danger" ? "#ffebeb" :
        "#eaf0ff";
      liveStatus.style.color =
        tone === "success" ? "#0d9f6e" :
        tone === "warning" ? "#b76d00" :
        tone === "danger" ? "#bc2e2e" :
        "#254eca";
      liveStatus.style.borderColor =
        tone === "success" ? "#d5f2e5" :
        tone === "warning" ? "#f5e5bf" :
        tone === "danger" ? "#f6d6d6" :
        "#dfe7ff";
    }

    function setTypingStatus(text, tone = "default") {
      typingStatus.textContent = text;
      typingStatus.style.background =
        tone === "success" ? "#e7f9f3" :
        tone === "warning" ? "#fff4df" :
        tone === "danger" ? "#ffebeb" :
        "#eaf0ff";
      typingStatus.style.color =
        tone === "success" ? "#0d9f6e" :
        tone === "warning" ? "#b76d00" :
        tone === "danger" ? "#bc2e2e" :
        "#254eca";
      typingStatus.style.borderColor =
        tone === "success" ? "#d5f2e5" :
        tone === "warning" ? "#f5e5bf" :
        tone === "danger" ? "#f6d6d6" :
        "#dfe7ff";
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function normalizeText(raw) {
      return String(raw || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();
    }

    function updateSourceMeta(label, kind) {
      sourceMeta.textContent = label;
      state.sourceLabel = label;
      state.sourceKind = kind;
    }

    function buildHomeworkText(question, notes, importedText) {
      const sourceSummary = importedText
        ? importedText.replace(/\s+/g, " ").slice(0, 1000)
        : "No source document was imported yet.";

      const answerIntro = [
        "The best answer is based on the evidence available in the source material and the context provided by the assignment.",
        "",
        "First, the French Revolution was driven by widespread economic hardship. Many people faced food shortages, rising bread prices, and growing debt, which put pressure on the lower and middle classes.",
        "",
        "Second, Enlightenment ideas challenged old forms of monarchy and privilege. Writers and thinkers promoted liberty, equality, and popular sovereignty, making it harder to justify the old social order.",
        "",
        "Third, social inequality was severe. The Third Estate paid most taxes while the First and Second Estates enjoyed privileges and exemption from many obligations.",
        "",
        "These factors combined to create a crisis in which ordinary people felt they had little to lose and much to gain by demanding political change.",
        "",
        "Specific examples include the financial crisis caused by France's debts, the widespread anger over bread shortages, and the storming of the Bastille in 1789, which symbolized the collapse of royal authority.",
        "",
        "In summary, the revolution came from a mix of economic pressure, political frustration, and social injustice. The result was a major shift away from absolutism toward ideas of citizenship, rights, and popular government.",
        "",
        "The answer above is written in a clear academic style and can be shortened or expanded depending on the assignment length."
      ].join("\n");

      const baseText = [
        "Question: " + question,
        "",
        "Context notes: " + (notes || "No extra notes."),
        "",
        "Web search enabled: " + (webSearchToggle.checked ? "Yes" : "No"),
        "",
        "Imported source preview: " + sourceSummary.slice(0, 220) + (sourceSummary.length > 220 ? "..." : ""),
        "",
        "Answer:",
        "",
        answerIntro
      ].join("\n");

      return baseText;
    }

    function pickWrongChar(original) {
      const alphabet = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ";
      if (!original || original === " ") return alphabet[Math.floor(Math.random() * alphabet.length)];
      if (Math.random() < 0.35) return original.toUpperCase() === original ? original.toLowerCase() : original.toUpperCase();
      return alphabet[Math.floor(Math.random() * alphabet.length)];
    }

    function simulateHumanTyping(rawText) {
      const sequence = [];
      const chars = Array.from(rawText);
      let mistakesPlaced = 0;
      const maxMistakes = Math.min(3, Math.max(1, Math.floor(chars.length / 150)));

      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];

        const shouldMistake = (
          maxMistakes > 0 &&
          i > 30 &&
          mistakesPlaced < maxMistakes &&
          (i % 23 === 0 || Math.random() < 0.018)
        );

        if (shouldMistake) {
          const wrong = pickWrongChar(ch);
          sequence.push({ type: "type", value: wrong, delay: randomBetween(70, 180) });
          sequence.push({ type: "backspace", count: 1, delay: randomBetween(120, 260) });
          sequence.push({ type: "type", value: ch, delay: randomBetween(60, 150) });
          mistakesPlaced++;
        } else {
          sequence.push({ type: "type", value: ch, delay: randomBetween(45, 140) });
        }

        if (i > 0 && i % 35 === 0) {
          sequence.push({ type: "pause", delay: randomBetween(260, 700) });
        }
      }

      return sequence;
    }

    function renderHistoryTimeline(text) {
      const segments = text.split(/\n{2,}/).filter(Boolean).slice(0, 5);
      const list = [];

      for (let i = 0; i < segments.length; i++) {
        const now = new Date();
        const offsetMs = (segments.length - i) * 55 * 1000;
        const timestamp = new Date(now.getTime() - offsetMs + randomBetween(400, 3000));
        const readableTime = timestamp.toISOString().replace(/\.\d{3}Z$/, "Z");
        const snippet = segments[i].replace(/\s+/g, " ").slice(0, 120) + (segments[i].length > 120 ? "..." : "");
        list.push({ time: readableTime, snippet });
      }

      historyList.innerHTML = "";
      list.forEach(item => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.innerHTML = `
          <div class="timestamp">${item.time}</div>
          <div class="activity">${item.snippet}</div>
        `;
        historyList.appendChild(li);
      });
    }

    function renderTyping(rawText) {
      if (state.isTyping && state.typingTimer) {
        clearTimeout(state.typingTimer);
      }

      typedPreview.textContent = "";
      const sequence = simulateHumanTyping(rawText);
      let index = 0;
      let visibleText = "";
      state.isTyping = true;
      setTypingStatus("Typing…", "warning");

      function step() {
        if (index >= sequence.length) {
          state.isTyping = false;
          setTypingStatus("Completed", "success");
          setBadge("Typing complete", "success");
          return;
        }

        const item = sequence[index];
        index++;

        if (item.type === "type") {
          visibleText += item.value;
          typedPreview.textContent = visibleText;
        } else if (item.type === "backspace") {
          visibleText = visibleText.slice(0, Math.max(0, visibleText.length - item.count));
          typedPreview.textContent = visibleText;
        } else if (item.type === "pause") {
          // no visible change, just a momentary pause
        }

        state.typingTimer = setTimeout(step, item.delay || 80);
      }

      step();
    }

    function generateHomework() {
      const q = questionInput.value.trim();
      const notes = notesInput.value.trim();
      const finalText = buildHomeworkText(q || "Write a short summary of the main idea.", notes, state.importedText);
      renderTyping(finalText);
      renderHistoryTimeline(finalText);
      setBadge("Working", "default");
    }

    function resetAll() {
      if (state.typingTimer) clearTimeout(state.typingTimer);
      state.isTyping = false;
      typedPreview.textContent = "";
      historyList.innerHTML = "";
      questionInput.value = "Explain the causes of the French Revolution and give 3 specific examples.";
      notesInput.value = "Use a clear high-school writing style. Mention economic instability, Enlightenment ideas, and social inequality. Keep the answer fact-based and concise.";
      webSearchToggle.checked = true;
      state.importedText = "";
      state.sourceLabel = "None selected";
      state.sourceKind = "none";
      sourceMeta.textContent = "None selected";
      setBadge("Ready", "default");
      setTypingStatus("Idle", "default");
    }

    async function readLocalFile(file) {
      if (!file) return;
      const name = file.name || "Uploaded file";
      const textTypes = [
        "text/", "application/json", "application/xml", "application/javascript",
        "application/vnd.ms-excel", "application/csv", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      ];
      const isLikelyText = textTypes.some(type => file.type.includes(type)) || /\.(txt|md|csv|json|xml)$/i.test(name);

      if (!isLikelyText) {
        updateSourceMeta(`${name} (binary file selected — paste text into notes for best results)`, "upload");
        setBadge("Binary file", "warning");
        setTypingStatus("Preview only", "warning");
        return;
      }

      const content = await file.text();
      state.importedText = normalizeText(content);
      updateSourceMeta(`${name} · uploaded`, "upload");
      setBadge("Source loaded", "success");
      setTypingStatus("Ready", "success");
    }

    function openGoogleFilePicker() {
      const hasGoogle = window.google && window.google.accounts && window.google.picker;
      if (!hasGoogle) {
        setBadge("Google API not ready", "warning");
        setTypingStatus("Retry in a moment", "warning");
        return;
      }

      if (GOOGLE_CLIENT_ID.includes("YOUR_") || GOOGLE_API_KEY.includes("YOUR_")) {
        setBadge("Add your Google credentials", "warning");
        setTypingStatus("Needs config", "warning");
        window.alert("To enable Google Drive import, replace the placeholder Google Client ID and API key in this HTML file.");
        return;
      }

      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: "https://www.googleapis.com/auth/drive.readonly",
        callback: (tokenResponse) => {
          if (tokenResponse.error) {
            setBadge("Google auth failed", "danger");
            setTypingStatus("Auth failed", "danger");
            return;
          }

          state.googleAccessToken = tokenResponse.access_token;

          const pickerBuilder = new google.picker.PickerBuilder()
            .setDeveloperKey(GOOGLE_API_KEY)
            .setOAuthToken(state.googleAccessToken)
            .setCallback(pickerCallback);

          if (GOOGLE_APP_ID && !GOOGLE_APP_ID.includes("YOUR_")) {
            pickerBuilder.setAppId(GOOGLE_APP_ID);
          }

          const docsView = new google.picker.View(google.picker.ViewId.DOCS);
          docsView.setMimeTypes(
            "application/vnd.google-apps.document," +
            "application/vnd.google-apps.spreadsheet," +
            "application/vnd.google-apps.presentation"
          );

          const picker = pickerBuilder
            .addView(docsView)
            .enableFeature(google.picker.Feature.NAV_HIDDEN)
            .build();

          picker.setVisible(true);
        }
      });

      tokenClient.requestAccessToken();
    }

    async function fetchGoogleDriveContent(fileId, mimeType) {
      if (!state.googleAccessToken) return;

      const targetMimeMap = {
        "application/vnd.google-apps.document": "text/plain",
        "application/vnd.google-apps.spreadsheet": "text/csv",
        "application/vnd.google-apps.presentation": "text/plain"
      };

      let url = "";
      if (mimeType && targetMimeMap[mimeType]) {
        url = `https://www.googleapis.com/drive/v3/files/${fileId}/export?mimeType=${encodeURIComponent(targetMimeMap[mimeType])}`;
      } else {
        url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
      }

      const response = await fetch(url, {
        headers: {
          Authorization: `Bearer ${state.googleAccessToken}`
        }
      });

      if (!response.ok) {
        throw new Error("Unable to fetch Google file");
      }

      return await response.text();
    }

    function pickerCallback(data) {
      if (data.action !== google.picker.Action.PICKED) return;

      const doc = data.docs && data.docs[0];
      if (!doc) return;

      const fileId = doc.id;
      const fileMime = doc.mimeType;
      const fileName = doc.name || "Google Drive file";

      fetchGoogleDriveContent(fileId, fileMime)
        .then((text) => {
          state.importedText = normalizeText(text);
          updateSourceMeta(`${fileName} · Google Drive`, "google");
          setBadge("Google source loaded", "success");
          setTypingStatus("Ready", "success");
        })
        .catch(() => {
          setBadge("Drive fetch failed", "danger");
          setTypingStatus("Fetch error", "danger");
        });
    }

    document.getElementById("generateBtn").addEventListener("click", generateHomework);
    document.getElementById("resetBtn").addEventListener("click", resetAll);
    document.getElementById("googleImportBtn").addEventListener("click", openGoogleFilePicker);
    localFileInput.addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      readLocalFile(file);
    });

    window.addEventListener("load", () => {
      setBadge("Ready", "default");
      setTypingStatus("Idle", "default");
      if (window.gapi) {
        gapi.load("picker", () => {
          // Google Picker is ready
        });
      }
    });
  </script>
</body>
</html>
